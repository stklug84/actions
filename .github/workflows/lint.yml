---
# @author:
# 	Steffen Klug <45033201+stklug84@users.noreply.github.com>
# @date:
# 	2026-06-10
# @keywords:
# 	infrastructure, linting
# @description:
# 	Lints the repository on pull requests against main:
# 	  - repo-lint    : actionlint (.github/workflows/*, incl. shellcheck
# 	                   on run: steps), yamllint (.yamllint.yml) and
# 	                   markdownlint (.markdownlint.yml) via the reusable
# 	                   stklug84/github-workflows repo-lint workflow
# 	  - shellcheck   : bash run: blocks inside composite action.yml files
# 	  - python-lint  : ruff (lint+format), mypy, bandit on cv/parse and
# 	                   cv/generate (each with its own pyproject.toml)
name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # actionlint (incl. shellcheck over run: blocks), yamllint and
  # markdownlint come from the shared catalog. The jobs below are the
  # checks unique to this repository: composite actions hide their bash
  # in `runs.steps[].run`, which actionlint does not read, and the cv
  # tooling carries its own per-directory pyproject.toml.
  repo-lint:
    uses: stklug84/github-workflows/.github/workflows/repo-lint.yml@e8b7009127c21bd66249ad5df0a0112c1d4f6553  # v4.0.0

  shellcheck-actions:
    name: shellcheck (composite actions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Shellcheck helper script itself
        run: |
          set -euo pipefail
          shellcheck scripts/shellcheck-actions.sh

      - name: Shellcheck bash steps in composite actions
        run: |
          set -euo pipefail
          scripts/shellcheck-actions.sh

  python-lint:
    name: python-lint (cv/parse, cv/generate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Python tooling
        run: |
          set -euo pipefail
          pip install --user \
            ruff==0.8.6 \
            mypy==1.14.1 \
            bandit==1.8.0 \
            PyYAML==6.0.2 \
            Jinja2==3.1.5 \
            types-PyYAML==6.0.12.20241230

      - name: Run ruff (lint)
        run: |
          set -euo pipefail
          (cd cv/parse && ruff check .)
          (cd cv/generate && ruff check .)

      - name: Run ruff (format check)
        run: |
          set -euo pipefail
          (cd cv/parse && ruff format --check .)
          (cd cv/generate && ruff format --check .)

      - name: Run mypy
        run: |
          set -euo pipefail
          (cd cv/parse && mypy scripts/parse.py)
          (cd cv/generate && mypy scripts/render_variants.py)

      - name: Run bandit
        run: |
          set -euo pipefail
          (cd cv/parse && bandit -r scripts -q)
          (cd cv/generate && bandit -r scripts -q)

      - name: Run cv/parse golden tests
        run: |
          set -euo pipefail
          bash cv/parse/test/run-tests.sh
