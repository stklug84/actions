---
# title: Dependabot version updates configuration
# authors:
#   - Steffen Klug <45033201+stklug84@users.noreply.github.com>
# date: 2026-06-10
# keywords: [infrastructure, dependencies]
# comment: |
#   Weekly version updates for GitHub Actions. The github-actions
#   ecosystem only scans .github/workflows for "/", so every composite
#   action directory is listed explicitly (via globs). All action
#   updates are grouped into a single pull request.
#   Documentation:
#   https://docs.github.com/code-security/dependabot/dependabot-version-updates
# ---

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/jekyll/*"
      - "/mtg/*"
      - "/python/*"
      - "/rdf/*"
      - "/release/*"
      - "/revealjs/*"
      - "/ruby/*"
      - "/texlive/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # reveal.js + KaTeX vendored into every deck by revealjs/build-html.
  - package-ecosystem: "npm"
    directory: "/revealjs/build-html"
    schedule:
      interval: "weekly"
    groups:
      revealjs-assets:
        patterns:
          - "*"

  # Toolchain image digests (pandoc, mermaid-cli, DeckTape) used by the
  # revealjs integration test. Consumers pin their own copy.
  - package-ecosystem: "docker"
    directory: "/revealjs/test/docker"
    schedule:
      interval: "weekly"
