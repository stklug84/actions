# Tooling configuration for the revealjs/build-html composite action's
# Python. Scoped to this directory so the rest of the repository — which is
# bash + YAML + Lua — is untouched. Tools are run from here:
#   ruff check . && ruff format --check .
#   mypy scripts/prepare.py
#   bandit -r scripts
[project]
name = "revealjs-build-html"
version = "0.0.0"
description = "Composite-action planner: deck front matter + theme -> pandoc defaults, SVG font embedding, HTML verification."
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["test/golden", "test/decks"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
files = ["scripts/prepare.py"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.bandit]
# Scan the planner sources; tests/fixtures are data, not runtime code.
exclude_dirs = ["test"]
