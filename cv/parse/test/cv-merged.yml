# MERGED multi-style fixture for cv/parse tests. Mechanically combines the
# tagged fixture (cv.yml) and the plain fixture (cv-plain.yml) into ONE
# source addressing two manifest styles via per-entry `targets`:
#   * tagged-side entries: `latex` rewritten to `cv-tagged-ia` (web kept)
#   * plain-side entries:  `latex` rewritten to `cv-plain-style`, `web`
#     dropped (the web target stays with the tagged side; a formerly
#     web-only plain entry keeps an empty target list — valid, unconsumed)
# meta/contact base is the tagged fixture's; the plain side's extra
# meta.pdf_title arrives through `overrides.cv-plain-style` — its `de` half
# below, its `en` half from the cv-merged.local.yml overlay — so goldens
# only match when per-style overrides AND overlay deep-merging both work.
# Emitting this file per --target-style must reproduce the plain/tagged/web
# goldens byte-for-byte (asserted by run-tests.sh).
